[tool.pytest.ini_options]
# Ensures `pytest tests -q` works from a clean checkout without requiring
# `python -m pytest`. `python -m pytest` implicitly puts the current working
# directory on sys.path, but a bare `pytest` invocation does not, which broke
# the `from src.xxx import ...` imports used throughout tests/.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: needs the real Kaggle NBA database and raw files (real players, row counts); CI runs on a generated league and skips these",
]
