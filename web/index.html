<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Sports AI — Analytics</title>
  <meta name="description" content="Professional NBA analytics dashboard: matchup predictions, team analysis, and season simulation powered by a validated prediction engine.">
  <meta name="theme-color" content="#0f1011">
  <!-- Blacktop Tabloid type: Anton (headlines), Big Shoulders Stencil (stamps),
       Permanent Marker (scrawls), Barlow / Barlow Condensed (data + labels).
       Every family has a system fallback stack in styles.css, so the layout
       holds if these never load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&family=Big+Shoulders+Stencil+Display:wght@900&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg class="brand-hoop" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <rect x="4" y="3" width="40" height="26" fill="#18191b" stroke="#f4f1ea" stroke-width="2.6"/>
            <rect x="16" y="12" width="16" height="11" fill="none" stroke="#ff5b14" stroke-width="2.6"/>
            <rect x="21.5" y="29" width="5" height="3" fill="#b7bdc3"/>
            <path d="M15 34 18.5 46M33 34 29.5 46M20 35 21.8 46M28 35 26.2 46M16.4 40h15.2M18 45.2h12" fill="none" stroke="#f4f1ea" stroke-width="1.5" stroke-linecap="round"/>
            <ellipse cx="24" cy="33.2" rx="10.2" ry="2.7" fill="none" stroke="#ff5b14" stroke-width="2.8"/>
          </svg>
          <span class="brand-name">NBA Sports AI</span>
        </div>
        <p class="brand-tag">Analytics engine</p>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main"></nav>
      <div class="sidebar-footer">
        <div class="status-pill" id="sidebar-status" role="status">
          <span class="status-dot"></span> Checking API…
        </div>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="masthead-kicker" aria-hidden="true">
          <span class="kicker-tag">NBA Sports AI</span>
          <span class="kicker-rule"></span>
          <span>Analytics desk</span>
        </div>
        <h1 id="topbar-title">Loading…</h1>
        <p id="topbar-subtitle"></p>
      </header>
      <div class="app-content" id="app-content"></div>
    </main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
