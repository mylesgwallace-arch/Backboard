name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src tests

      # data/ (nba.db, processed features; ~2 GB) is not in git, so tests
      # marked requires_data are skipped here (see tests/conftest.py). Run
      # the full suite locally before merging a model or pipeline change.
      - name: Tests (data-free subset)
        run: python -m pytest -q -rs

      # Fails if any committed validation report in models/ regressed past
      # its recorded bound (models/metric_gates.json) or stopped beating its
      # baseline.
      - name: Metrics regression gate
        run: python src/metrics_gate.py
